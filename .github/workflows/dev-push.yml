# .github/workflows/dev-push.yml
# ─────────────────────────────────────────────────────────────
# Push to main → build all images. ArgoCD deploys.
# ─────────────────────────────────────────────────────────────
name: CI → Dev

on:
  push:
    branches: [main]

concurrency:
  group: dev-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      images: >-
        [
          { "name": "paperclip", "context": ".", "dockerfile": "./Dockerfile" }
        ]
      # Intentionally NOT passing `registry:` — the org variable
      # DOCKER_REGISTRY_HOST still points at the retired unauthenticated
      # registry, which would send dev builds to the old host. Falling through
      # to the reusable workflow default targets Harbor (mare-dev).
    # The reusable workflow needs the Harbor push credentials; a called
    # workflow sees no caller secrets unless they are inherited.
    secrets: inherit
