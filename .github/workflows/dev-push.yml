# .github/workflows/dev-push.yml
# ─────────────────────────────────────────────────────────────
# Push to main → build all images. ArgoCD deploys.
# ─────────────────────────────────────────────────────────────
name: CI → Dev

on:
  push:
    branches: [main]

concurrency:
  group: dev-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      images: >-
        [
          { "name": "paperclip", "context": ".", "dockerfile": "./Dockerfile" }
        ]
      # Not passing `registry:` — the reusable workflow's default already
      # targets Harbor's mare-dev project. The org variable
      # DOCKER_REGISTRY_HOST now resolves to the same value
      # (registry.mareanalytica.com/mare-dev), so either route lands in the
      # same place; the default is kept so this build does not depend on an
      # org-level setting.
    # The reusable workflow needs the Harbor push credentials; a called
    # workflow sees no caller secrets unless they are inherited.
    secrets: inherit
