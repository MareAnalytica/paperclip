# .github/workflows/_build.yml
# ─────────────────────────────────────────────────────────────
# Reusable workflow: build Docker images and push to in-cluster
# registry. Runs on ARC (k3s) with Docker-in-Docker.
# Copy this file as-is into any repo — no project-specific values.
# ─────────────────────────────────────────────────────────────
name: Build Images

on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON array of images to build.
          Each object: { "name": "<image-name>", "context": "<build-context>", "dockerfile": "<path>" }
        required: true
        type: string
      registry:
        description: "Registry host:port (in-cluster or external)"
        required: false
        type: string
        default: "registry.mareanalytica.com/mare-dev"
      filter:
        description: "Optional substring filter — only build images whose name contains this. Empty = all."
        required: false
        type: string
        default: ""
    outputs:
      digests:
        description: >
          DEE-706: compact JSON map of { "<registry>/<name>": "<sha256:digest>" } for every
          image actually built this run. A caller can feed this into a promote step.s
          `image_digests` input to promote the exact, content-addressed build it just
          produced (instead of relying on a static overlay pin that never moves).
        value: ${{ jobs.build.outputs.digests }}

jobs:
  build:
    runs-on: liquidmetal
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Docker (DinD)
        run: |
          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            docker info > /dev/null 2>&1 && break
            echo "  attempt ${i}/30..."
            sleep 2
          done
          docker info > /dev/null 2>&1 || { echo "Docker not ready after 60s"; exit 1; }
          echo "✓ Docker is ready"

      # Harbor requires auth on push; the old in-cluster registry did not, which is
      # why this workflow never had a login step. `inputs.registry` carries host +
      # project path (registry.mareanalytica.com/mare-dev) but `docker login`
      # takes the bare host, so strip the path. The login is gated on the secret
      # being present so a caller that does not pass `secrets: inherit` (or a
      # target registry that needs no auth) still builds instead of hard-failing.
      - name: Resolve registry host
        id: registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
        run: |
          set -euo pipefail
          echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          if [ -n "${REGISTRY_USERNAME:-}" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No registry credentials available; skipping docker login."
          fi

      - name: Log in to the registry
        if: steps.registry.outputs.login == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.HARBOR_CI_USERNAME }}
          password: ${{ secrets.HARBOR_CI_PASSWORD }}

      - name: Build and push images
        id: build
        env:
          IMAGES_JSON: ${{ inputs.images }}
          REGISTRY: ${{ inputs.registry }}
          FILTER: ${{ inputs.filter }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t NAMES       < <(echo "${IMAGES_JSON}" | jq -r '.[].name')
          mapfile -t CONTEXTS    < <(echo "${IMAGES_JSON}" | jq -r '.[].context')
          mapfile -t DOCKERFILES < <(echo "${IMAGES_JSON}" | jq -r '.[].dockerfile')

          # DEE-706: immutable, content-addressed promotion.
          # In addition to the mutable :latest tag (kept for backwards compat), tag
          # and push an immutable sha-<gitsha> tag, and capture the registry digest
          # returned by `docker push`. The digest map is emitted as a workflow output
          # so a deploy job can pin the EXACT image it just built. Without this, a
          # digest-pinned overlay (e.g. kube/overlays/dev) never sees new code:
          # apply -k re-applies the same old digest and rollout restart re-pulls it.
          SHORT_SHA="${GIT_SHA:0:12}"
          DIGESTS_JSON='{}'

          # DEE-708: large-layer pushes can hit transient client-disconnect / HTTP 499
          # drops on the registry ingress path. Retry the push with linear backoff so a
          # transient drop self-heals instead of failing the whole image promotion.
          # (The Dockerfile also splits the formerly oversized layer so blobs stay small;
          # this retry is defense-in-depth for the residual marginal-capacity edge.)
          # On success the final push output is emitted on stdout (so the caller can parse
          # the digest); retry/diagnostic lines go to stderr.
          push_with_retry() {
            local ref="$1" attempt=1 max=4 out=""
            while :; do
              if out="$(docker push "${ref}" 2>&1)"; then
                printf '%s\n' "${out}"
                return 0
              fi
              printf '%s\n' "${out}" >&2
              if [ "${attempt}" -ge "${max}" ]; then
                echo "✗ push of ${ref} failed after ${max} attempts" >&2
                return 1
              fi
              local sleep_s=$((attempt * 15))
              echo "↻ push of ${ref} failed (attempt ${attempt}/${max}); retrying in ${sleep_s}s..." >&2
              sleep "${sleep_s}"
              attempt=$((attempt + 1))
            done
          }

          for i in "${!NAMES[@]}"; do
            name="${NAMES[$i]}"
            context="${CONTEXTS[$i]}"
            dockerfile="${DOCKERFILES[$i]}"

            if [ -n "${FILTER}" ] && [[ "${name}" != *"${FILTER}"* ]]; then
              echo "⏭  Skipping ${name} (filter: ${FILTER})"
              continue
            fi

            tag_latest="${REGISTRY}/${name}:latest"
            tag_sha="${REGISTRY}/${name}:sha-${SHORT_SHA}"
            echo "══════════════════════════════════════════"
            echo "Building ${name}"
            echo "  → ${tag_latest}"
            echo "  → ${tag_sha}"
            echo "  context:    ${context}"
            echo "  dockerfile: ${dockerfile}"
            echo "══════════════════════════════════════════"
            docker build -t "${tag_latest}" -t "${tag_sha}" -f "${dockerfile}" "${context}"

            push_with_retry "${tag_latest}"
            # Push the immutable tag and capture the digest from push output.
            push_out="$(push_with_retry "${tag_sha}")"
            echo "${push_out}"
            digest="$(echo "${push_out}" | sed -n 's/.*[[:space:]]digest:[[:space:]]\(sha256:[0-9a-f]\{64\}\).*/\1/p' | head -1)"
            if [ -z "${digest}" ]; then
              echo "✗ Could not parse pushed digest for ${name}" >&2
              exit 1
            fi
            echo "✓ ${name} pushed (digest: ${digest})"
            DIGESTS_JSON="$(jq -c --arg k "${REGISTRY}/${name}" --arg v "${digest}" '. + {($k): $v}' <<<"${DIGESTS_JSON}")"
            echo ""
          done

          echo "Image digests: ${DIGESTS_JSON}"
          echo "digests=${DIGESTS_JSON}" >> "$GITHUB_OUTPUT"
