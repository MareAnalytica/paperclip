# .github/workflows/prod-tag.yml
# ─────────────────────────────────────────────────────────────
# Tag v* → build all images. ArgoCD deploys.
# ─────────────────────────────────────────────────────────────
name: Release → Prod

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      images: >-
        [
          { "name": "paperclip", "context": ".", "dockerfile": "./Dockerfile" }
        ]
      registry: ${{ vars.DOCKER_REGISTRY_HOST }}

