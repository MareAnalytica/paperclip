name: Refresh Lockfile

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-master
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: liquidmetal-dev
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Push refreshed lockfile branch
        id: push-branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Replaces the previous `gh pr create` / `gh pr merge` steps so the
      # workflow no longer depends on the GitHub CLI being installed in the ARC
      # runner image (it is not — see ELI-939). actions/github-script bundles an
      # authenticated Octokit client, so PR upsert + auto-merge run via the REST
      # and GraphQL APIs directly with no runtime CLI dependency.
      - name: Upsert PR and enable auto-merge
        if: steps.push-branch.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.push-branch.outputs.branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const { owner, repo } = context.repo;
            const base = context.payload.repository?.default_branch || 'main';

            // Only reuse an open PR whose head branch lives in this repository
            // (head filter is `owner:branch`), not a fork sharing the name.
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
            });

            let pr = existing.data[0];
            if (pr) {
              core.info(`PR already exists: ${pr.html_url}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base,
                title: 'chore(lockfile): refresh pnpm-lock.yaml',
                body:
                  'Auto-generated lockfile refresh after dependencies changed on ' +
                  base +
                  '. This PR only updates pnpm-lock.yaml.',
              });
              pr = created.data;
              core.info(`Created new PR: ${pr.html_url}`);
            }

            // Enable squash auto-merge. There is no REST endpoint for this, so
            // use the GraphQL enablePullRequestAutoMerge mutation.
            try {
              await github.graphql(
                `mutation ($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pullRequestId: pr.node_id },
              );
              core.info(`Auto-merge enabled for ${pr.html_url}`);
            } catch (err) {
              // enablePullRequestAutoMerge fails in several benign-for-us cases:
              //   - "in clean status" / "not in the correct state": the PR has no
              //     required checks and is already mergeable;
              //   - "Auto-merge is not allowed for this repository": repo-level
              //     auto-merge is disabled (it is for this repo).
              // In all of these the right outcome is the same — land the
              // lockfile refresh now — so fall back to a direct squash merge and
              // only surface an error if that direct merge also fails.
              core.info(`Auto-merge unavailable (${err && err.message}); attempting direct squash merge.`);
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Squash-merged ${pr.html_url}`);
            }
