# .github/workflows/_deploy.yml
# ─────────────────────────────────────────────────────────────
# Reusable workflow: deploy to Kubernetes using a kustomize overlay.
# Assumes the selected runner already has kubectl credentials.
# Copy this file as-is into any repo — no project-specific values.
# ─────────────────────────────────────────────────────────────
name: Deploy to k3s

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: 'dev' or 'prod'"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace to deploy into"
        required: true
        type: string
      overlay_path:
        description: "Path to kustomize overlay directory. Defaults to kube/overlays/<environment>."
        required: false
        type: string
        default: ""
      deployments:
        description: >
          Comma-separated list of Deployment names to rollout restart
          (e.g. "frontend,backend,worker")
        required: true
        type: string
      rollout_timeout:
        description: "Timeout for each deployment rollout"
        required: false
        type: string
        default: "300s"
      image_digests:
        description: >
          DEE-706: optional compact JSON map of { "<registry>/<name>": "<sha256:digest>" }
          (typically the `digests` output of _build.yml). When non-empty, each entry is
          pinned onto the overlay via `kustomize edit set image <name>@<digest>` BEFORE
          `kubectl apply -k`, so the deploy promotes the exact image just built rather
          than re-applying a stale static digest. Empty (default) = apply the overlay
          as committed (unchanged legacy behaviour; e.g. prod promotion stays untouched).
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Verify kubectl access
        run: |
          set -euo pipefail
          echo "Checking kubectl via ServiceAccount..."
          kubectl cluster-info
          echo "✓ kubectl connected"

      - name: Resolve overlay path
        id: overlay
        run: |
          path="${{ inputs.overlay_path }}"
          if [ -z "${path}" ]; then
            path="kube/overlays/${{ inputs.environment }}"
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # DEE-706: pin freshly-built image digests onto the overlay before apply.
      # Skipped entirely when image_digests is empty, so callers that do not pass
      # it (e.g. prod) keep applying the overlay exactly as committed.
      - name: Pin promoted image digests
        if: ${{ inputs.image_digests != '' }}
        env:
          IMAGE_DIGESTS: ${{ inputs.image_digests }}
          OVERLAY_PATH: ${{ steps.overlay.outputs.path }}
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=v5.4.3
          echo "Installing kustomize ${KUSTOMIZE_VERSION}..."
          curl -sLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

          cd "${OVERLAY_PATH}"
          echo "Pinning promoted digests into ${OVERLAY_PATH}/kustomization.yaml:"
          echo "${IMAGE_DIGESTS}" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r name digest; do
            [ -z "${name}" ] && continue
            echo "  → ${name}@${digest}"
            kustomize edit set image "${name}@${digest}"
          done
          echo "--- effective image transformers ---"
          kustomize cfg cat kustomization.yaml 2>/dev/null | sed -n '/^images:/,/^[^ -]/p' || sed -n '/^images:/,/^[^ -]/p' kustomization.yaml

      - name: Apply kustomize overlay (${{ inputs.environment }})
        run: |
          set -euo pipefail
          echo "Deploying: ${{ steps.overlay.outputs.path }} → namespace ${{ inputs.namespace }}"
          kubectl apply -k "${{ steps.overlay.outputs.path }}"

      - name: Rollout restart deployments
        run: |
          set -euo pipefail
          NS="${{ inputs.namespace }}"
          IFS=',' read -ra DEPS <<< "${{ inputs.deployments }}"
          echo "Restarting ${#DEPS[@]} deployment(s) in namespace ${NS}"
          for dep in "${DEPS[@]}"; do
            dep="$(echo "${dep}" | xargs)"
            echo "  → restarting ${dep}"
            kubectl -n "${NS}" rollout restart "deployment/${dep}"
          done

      - name: Wait for rollout
        run: |
          set -uo pipefail
          NS="${{ inputs.namespace }}"
          RAW_TIMEOUT="${{ inputs.rollout_timeout }}"
          # Convert the kubectl-style duration (e.g. "600s", "10m") into seconds for our
          # own bounded poll loop. Fall back to 300s if it cannot be parsed.
          case "${RAW_TIMEOUT}" in
            *m) DEADLINE_SECS=$(( ${RAW_TIMEOUT%m} * 60 )) ;;
            *s) DEADLINE_SECS=${RAW_TIMEOUT%s} ;;
            *[0-9]) DEADLINE_SECS=${RAW_TIMEOUT} ;;
            *) DEADLINE_SECS=300 ;;
          esac
          IFS=',' read -ra DEPS <<< "${{ inputs.deployments }}"

          # Comma-joined label selector for a deployment's pods (generic — derived from
          # the Deployment's own matchLabels, no hard-coded app= convention).
          deploy_selector() {
            kubectl -n "${NS}" get deploy "$1" \
              -o go-template='{{range $k,$v := .spec.selector.matchLabels}}{{$k}}={{$v}},{{end}}' \
              | sed 's/,$//'
          }

          # Print rollout/scheduling diagnostics so the failure cause (e.g.
          # FailedScheduling / Insufficient memory) is captured inline in the job log and
          # survives GitHub Actions log retention/GC — the exact gap that left DEE-704's
          # historical failures un-diagnosable.
          dump_diagnostics() {
            local dep="$1" sel
            sel="$(deploy_selector "${dep}")"
            echo "::group::Diagnostics for deployment/${dep} (${NS})"
            kubectl -n "${NS}" get deploy "${dep}" -o wide || true
            kubectl -n "${NS}" get pods -l "${sel}" -o wide || true
            echo "--- describe of non-Running pods (Events) ---"
            kubectl -n "${NS}" get pods -l "${sel}" \
              -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.name}{"\n"}{end}' \
              | while read -r pod; do
                  [ -z "${pod}" ] && continue
                  kubectl -n "${NS}" describe pod "${pod}" | sed -n '/Events:/,$p' || true
                done
            echo "--- recent namespace events ---"
            kubectl -n "${NS}" get events --sort-by=.lastTimestamp | tail -25 || true
            echo "::endgroup::"
          }

          # True when a pod is genuinely unschedulable (PodScheduled=False/Unschedulable),
          # e.g. a surge replica that cannot fit on a saturated node. This is the
          # fail-fast signal — distinct from a pod that is briefly Pending while being
          # scheduled normally.
          has_unschedulable_pod() {
            local dep="$1" sel
            sel="$(deploy_selector "${dep}")"
            kubectl -n "${NS}" get pods -l "${sel}" \
              -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="PodScheduled")]}{.status}={.reason}{"\n"}{end}{end}' 2>/dev/null \
              | grep -q '^False=Unschedulable$'
          }

          fail=0
          for dep in "${DEPS[@]}"; do
            dep="$(echo "${dep}" | xargs)"
            echo "Waiting for ${dep} (deadline ${DEADLINE_SECS}s)..."
            start=${SECONDS}
            done_ok=0
            while [ $(( SECONDS - start )) -lt "${DEADLINE_SECS}" ]; do
              # Short, repeated bounded checks instead of one long blocking wait, so a
              # fail-fast unschedulable check can be interleaved.
              if kubectl -n "${NS}" rollout status "deployment/${dep}" --timeout=15s; then
                echo "✓ ${dep} rolled out"
                done_ok=1
                break
              fi
              if has_unschedulable_pod "${dep}"; then
                echo "::error::deployment/${dep}: a pod is Unschedulable (node capacity). Failing fast instead of waiting out ${RAW_TIMEOUT}. See DEE-705 (node memory) / DEE-696 (replicas:2)."
                break
              fi
              sleep 5
            done
            if [ "${done_ok}" -ne 1 ]; then
              if [ $(( SECONDS - start )) -ge "${DEADLINE_SECS}" ]; then
                echo "::error::Rollout of deployment/${dep} did not complete within ${RAW_TIMEOUT}."
              fi
              dump_diagnostics "${dep}"
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more deployments failed to roll out in ${NS}."
            exit 1
          fi
          echo "✓ All deployments rolled out in ${NS}"
