# kube/overlays/dev/kustomization.yaml
# Dev environment overlay -- smaller resources, separate namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: paperclip-dev

resources:
  - ../../base

images:
  # DEE-695 (DEE-694/DEE-692 class): pin the dev image to the running, verified digest
  # instead of the mutable :latest tag. Removes nondeterministic rollouts and the
  # ~1.3GB re-pull per restart (paired with base imagePullPolicy: IfNotPresent).
  # Bump this digest deliberately when promoting a new dev build.
  - name: registry.mareanalytica.com/paperclip
    digest: sha256:b2482205344f5725ba4b38fbdfafe311e288dabd7c5bf253e778c8228516ab10

patches:
  # Override namespace name for dev
  - target:
      kind: Namespace
      name: paperclip
    patch: |
      - op: replace
        path: /metadata/name
        value: paperclip-dev
      - op: replace
        path: /metadata/labels/environment
        value: dev

  # Override ingress host for dev (wildcard-tls from base applies to all subdomains)
  - target:
      kind: Ingress
      name: paperclip
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: paperclip-dev.mareanalytica.com
      - op: replace
        path: /spec/rules/0/host
        value: paperclip-dev.mareanalytica.com

  # Reduce app deployment resources and fix DB URL for dev namespace
  - target:
      kind: Deployment
      name: paperclip
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperclip
      spec:
        # ELI-903: zero-downtime rollout. With replicas:1, maxSurge:0+maxUnavailable:1
        # tore the only pod down BEFORE its replacement bound :3100, leaving the
        # Service endpoint empty on every rollout/restart -> external Traefik 502
        # on all routes until the new pod's startup probe passed. maxSurge:1+
        # maxUnavailable:0 brings up a new Ready pod before removing the old one,
        # so the endpoint always has a serving backend.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        template:
          spec:
            containers:
              - name: paperclip
                env:
                  - name: NODE_OPTIONS
                    value: "--max-old-space-size=3072"
                  - name: DATABASE_URL
                    value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@paperclip-db.paperclip-dev.svc.cluster.local:5432/$(POSTGRES_DB)"
                  - name: PAPERCLIP_ALLOWED_HOSTNAMES
                    value: "paperclip-dev.mareanalytica.com"
                  - name: BETTER_AUTH_BASE_URL
                    value: "https://paperclip-dev.mareanalytica.com"
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "50m"
                    # ELI-903: account for the /tmp + /app/data emptyDir budget so
                    # the scheduler reserves node ephemeral storage and a noisy /tmp
                    # does not trip a node-level DiskPressure eviction.
                    ephemeral-storage: "3Gi"
                  limits:
                    memory: "4Gi"
                    cpu: "1000m"
                    ephemeral-storage: "5Gi"
            # ELI-903: raise the /tmp emptyDir cap. Root fs is read-only, so the app
            # must write scratch/uploads to /tmp; the old 1Gi cap evicted the pod
            # (which, with replicas:1, caused the same external 502 gap).
            volumes:
              - name: tmp
                emptyDir:
                  sizeLimit: 3Gi

  # Reduce PostgreSQL StatefulSet resources for dev
  - target:
      kind: StatefulSet
      name: paperclip-db
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: paperclip-db
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "50m"
                  limits:
                    memory: "512Mi"
                    cpu: "1000m"

  # ELI-910: fix netpol for actual ingress (traefik in kube-system, not ingress-nginx)
  # and provide same-namespace allow (the ns transformer does not rewrite nsSelector values).
  - target:
      kind: NetworkPolicy
      name: allow-ingress-from-traefik
    patch: |
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: kube-system
  - target:
      kind: NetworkPolicy
      name: allow-same-namespace-ingress
    patch: |
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: paperclip-dev
