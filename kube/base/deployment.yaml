apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/component: web
spec:
  replicas: 1
  # ELI-911 (follow-up to ELI-903): pin a zero-downtime rollout explicitly instead
  # of relying on the implicit RollingUpdate default. With replicas:1 the k8s default
  # (maxSurge:25%/maxUnavailable:25%) only rounds to maxSurge:1/maxUnavailable:0 by
  # luck; any future replica/strategy change — or an overlay that overrides it like
  # the old dev overlay did (maxSurge:0/maxUnavailable:1) — would empty the paperclip
  # Service endpoint on every rollout/restart/eviction and return external Traefik
  # 502s on all routes (incl /health). Pinning maxSurge:1/maxUnavailable:0 guarantees
  # a new Ready pod binds :3100 before the old one is removed.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
        app.kubernetes.io/name: paperclip
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: paperclip-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: registry.mareanalytica.com/paperclip:latest
          # DEE-695 (DEE-694/DEE-692 class): pull policy IfNotPresent so a digest-pinned
          # image (set per-overlay via kustomize `images:`) is not re-pulled (~1.3GB) on
          # every pod start/rollout and rollouts stay deterministic. With a digest, the
          # tag here is only a human-readable placeholder; the overlay digest wins.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@paperclip-db.paperclip.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: "paperclip.mareanalytica.com,paperclip-dev.mareanalytica.com"
            - name: BETTER_AUTH_BASE_URL
              value: "https://paperclip.mareanalytica.com"
          envFrom:
            - configMapRef:
                name: paperclip-config
            - secretRef:
                name: paperclip-secrets
            - secretRef:
                name: paperclip-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              # ELI-911: reserve node ephemeral storage for the /tmp + /app/data
              # emptyDir budget so a noisy /tmp cannot trip a node-level DiskPressure
              # eviction (which, at replicas:1, reproduces the same external 502 gap).
              ephemeral-storage: "3Gi"
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: "5Gi"
          # DEE-695 (DEE-694/DEE-692 class): HTTP-aware probes. A bare `tcpSocket :3100`
          # only proves the socket is open, so a hung-but-listening pod (event loop
          # wedged, DB pool exhausted, etc.) stays Ready in the Service endpoints and
          # external Traefik returns 502 on all routes until a MANUAL `kubectl rollout
          # restart`. httpGet /api/health makes a wedged pod fail readiness (dropped
          # from endpoints -> KubeServiceWithNoEndpoints alert) and fail liveness
          # (automatic restart within the probe budget) with no human in the loop.
          #
          # Host header: /api/health sits behind privateHostnameGuard, which 403s any
          # Host not in PAPERCLIP_ALLOWED_HOSTNAMES *except* loopback. `localhost` is
          # always allowed, so this is portable across base/dev/prod without an
          # overlay-specific Host patch (kubelet otherwise sends Host: <podIP> -> 403).
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 3100
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: paperclip-home
              mountPath: /paperclip
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            # ELI-911: raise /tmp cap. Root fs is read-only (readOnlyRootFilesystem:
            # true), so the app writes scratch/uploads to /tmp; the old 1Gi cap
            # evicted the pod, which at replicas:1 caused the external 502 gap.
            sizeLimit: 3Gi
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: paperclip-home
          persistentVolumeClaim:
            claimName: paperclip-home-pvc
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
